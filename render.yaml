# Render Blueprint: FastAPI backend + managed Postgres.
# In the Render dashboard: New + -> Blueprint -> connect this repo. It creates the
# web service and the database, wires DATABASE_URL, and generates JWT_SECRET.
#
# IMPORTANT: the API refuses to start in production unless JWT_SECRET is set
# (>= 32 chars) and ALLOWED_ORIGINS is an explicit origin (not "*"). Fill in the
# `sync: false` values in the dashboard BEFORE deploying this version.
services:
  - type: web
    name: qguide-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements-api.txt"
    startCommand: "uvicorn qguide.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qguide-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false            # REQUIRED: https://<your-app>.vercel.app (comma-separated if several)
      - key: ADMIN_EMAILS
        sync: false            # REQUIRED for first admin: comma-separated emails promoted to ADMIN
      - key: APP_BASE_URL
        sync: false            # https://<your-app>.vercel.app — used in emailed links
      # ---- email (password resets, invitations). Without SMTP_HOST, emails go to the log.
      - key: EMAIL_BACKEND
        value: auto
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # ---- branding (optional; defaults in qguide/app/branding.py)
      - key: APP_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: LEGAL_COMPANY_NAME
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.10"

databases:
  - name: qguide-db
    plan: free
    region: oregon
